name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      # Transport and reliability tests use explicit invented fixtures.
      # MovieLens research data is not downloaded or redistributed by CI.
